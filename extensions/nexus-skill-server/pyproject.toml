[project]
name = "nexus-skill-server"
version = "2.0.0"
description = "MCP server for Nexus-Hub skill discovery and tiered retrieval"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benjamin Dourthe"}]
dependencies = [
    "mcp>=1.0.0",
    # Security floor for a transitive dependency of mcp: PyJWT <= 2.14.0 lets a nested payload raise RecursionError before signature checks (GHSA-42vr-xj54-vc7v, fixed in 2.15.0).
    "pyjwt>=2.15.0",
]

[project.optional-dependencies]
embeddings-local = ["sentence-transformers>=2.2.0", "numpy>=1.24.0"]
embeddings-openai = ["openai>=1.0.0"]
embeddings-api = ["httpx>=0.25.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
nexus-skill-server = "nexus_skill_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_skill_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
