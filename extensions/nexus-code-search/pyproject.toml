[project]
name = "nexus-code-search"
version = "2.0.0"
description = "Nexus-Hub local-only code-search MCP server (v2.0 adds tree-sitter AST graph + call-graph + file-watcher; keyword search kept for back-compat)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benjamin Dourthe"}]
dependencies = [
    "mcp>=1.0.0",
    "rapidfuzz>=3.5.0",
    "pathspec>=0.12.0",
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
nexus-code-search = "nexus_code_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_code_search"]

[tool.hatch.build.targets.wheel.force-include]
"src/nexus_code_search/eval/fixtures" = "nexus_code_search/eval/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
