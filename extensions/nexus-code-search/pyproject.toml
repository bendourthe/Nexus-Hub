[project]
name = "nexus-code-search"
version = "2.1.0"
description = "Nexus-Hub local-only code-search MCP server (v2.1 adds the compiled context map: framework routes/env/middleware, ORM schema, components, events, hot-file ranking, a git-scoped change map, a token-savings benchmark, a map-health lint, and a knowledge-map extractor; v2.0 tree-sitter AST graph + call-graph + file-watcher; keyword search kept for back-compat)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benjamin Dourthe"}]
dependencies = [
    "mcp>=1.0.0",
    "rapidfuzz>=3.5.0",
    "pathspec>=0.12.0",
    # tree-sitter core + per-language grammars. The <0.26 ceiling guards
    # against an ABI break: the abandoned `tree-sitter-languages` umbrella
    # crashes on core >=0.23, so each grammar is pinned as its own package.
    # Pin re-verified 2026-05-29 (v2.3.0 Phase 8 / WN-5): no 0.26-compatible
    # release of core (latest 0.25.2), tree-sitter-python (0.25.0), or
    # tree-sitter-typescript (0.23.2) has shipped, so the ceiling stays.
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    # Phase 8 / DF-002 extractor batch: Go, Rust, Java, C#. All resolve under
    # the shared <0.26 ceiling (go 0.25, rust 0.24, java/c-sharp 0.23).
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.26",
    "tree-sitter-c-sharp>=0.23,<0.26",
    # v2.4.0 / DF-v23-4 extractor batch: Ruby, PHP, C, C++. All resolve under
    # the shared <0.26 ceiling (ruby 0.23, php 0.24, c 0.24, cpp 0.23).
    "tree-sitter-ruby>=0.23,<0.26",
    "tree-sitter-php>=0.23,<0.26",
    "tree-sitter-c>=0.23,<0.26",
    "tree-sitter-cpp>=0.23,<0.26",
    # v3.0.0 / DF-v24-7 mobile extractor batch: Swift, Kotlin. These two
    # grammars version their OWN package independently of the tree-sitter core
    # (swift at 0.7.x, kotlin at 1.x), so they do not carry a <0.26 marker; the
    # <0.26 ceiling above guards the CORE ABI, not each grammar's package
    # version. Both were verified ABI-compatible with core 0.25.2 (parse + node
    # extraction) on 2026-06-04; their PyPI metadata declares core ~=0.23/~=0.22
    # only as an optional `[core]` extra, which we do not install.
    "tree-sitter-swift>=0.7,<0.8",
    "tree-sitter-kotlin>=1.1,<2",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
nexus-code-search = "nexus_code_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_code_search"]

[tool.hatch.build.targets.wheel.force-include]
"src/nexus_code_search/eval/fixtures" = "nexus_code_search/eval/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
