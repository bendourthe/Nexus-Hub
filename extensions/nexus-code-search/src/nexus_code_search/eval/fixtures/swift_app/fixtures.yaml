name: swift_app
description: Swift module - exercises protocol/class/struct/enum/method extraction, superclass extends, import declarations, and in-file function calls.
questions:
  - tool: code_search
    query: Animal
    expect: [Animal]
  - tool: code_search
    query: greet
    expect: [greet]
  - tool: code_search
    query: hello
    expect: [hello]
  - tool: code_callees
    symbol: greet
    expect_callees: [hello]
  - tool: code_callers
    symbol: hello
    expect_callers: [greet]
