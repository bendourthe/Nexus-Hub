name: rust_app
description: Rust crate - exercises struct/trait/impl extraction, implements edges, struct-literal instantiation, and in-file calls.
questions:
  - tool: code_search
    query: Circle
    expect: [Circle]
  - tool: code_search
    query: Shape
    expect: [Shape]
  - tool: code_search
    query: make
    expect: [make]
  - tool: code_callees
    symbol: run
    expect_callees: [make, area]
  - tool: code_callers
    symbol: make
    expect_callers: [run]
