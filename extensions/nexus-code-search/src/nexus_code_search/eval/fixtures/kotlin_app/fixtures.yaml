name: kotlin_app
description: Kotlin module - exercises interface/class/object/enum/method extraction, superclass extends + interface implements, import declarations, and in-file function calls.
questions:
  - tool: code_search
    query: Animal
    expect: [Animal]
  - tool: code_search
    query: greet
    expect: [greet]
  - tool: code_search
    query: hello
    expect: [hello]
  - tool: code_callees
    symbol: greet
    expect_callees: [hello]
  - tool: code_callers
    symbol: hello
    expect_callers: [greet]
