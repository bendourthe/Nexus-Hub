name: ruby_app
description: Ruby module - exercises module/class/method extraction, superclass extends, require imports, and in-file method calls.
questions:
  - tool: code_search
    query: Greeter
    expect: [Greeter]
  - tool: code_search
    query: greet
    expect: [greet]
  - tool: code_search
    query: hello
    expect: [hello]
  - tool: code_callees
    symbol: greet
    expect_callees: [hello]
  - tool: code_callers
    symbol: hello
    expect_callers: [greet]
