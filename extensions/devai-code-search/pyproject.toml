[project]
name = "devai-code-search"
version = "1.0.0"
description = "DevAI-Hub local-only code-search MCP server (keyword-only in v1.0.0; dense/hybrid planned for v1.1.0)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benjamin Dourthe"}]
dependencies = [
    "mcp>=1.0.0",
    "rapidfuzz>=3.5.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
devai-code-search = "devai_code_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devai_code_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
