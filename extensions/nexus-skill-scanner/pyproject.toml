[project]
name = "nexus-skill-scanner"
version = "3.0.0"
description = "Nexus-Hub local-only static skill-security scanner (16 vulnerability classes, fence-aware, SARIF/JSON/Markdown output, zero outbound by default)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benjamin Dourthe"}]
# Stdlib-only, top to bottom: regex, ast, json, urllib. No third-party runtime
# dependency is required for anything -- including the Phase 7 optional modules.
# The class-14 signature module is a self-contained pure-Python rule engine
# (reverse-engineered rather than wrapping a native binding), and the OSV.dev
# dependency lookup uses stdlib urllib against a bundled offline advisory DB.
# Both are opt-in (--yara / --osv), default off, and ship no extra to install.
# The semantic-adjudication stage is a Nexus-Hub skill run by the user's own
# agent (no bundled LLM client, no API key).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nexus-skill-scanner = "nexus_skill_scanner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_skill_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
