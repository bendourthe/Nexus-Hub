# OpenAI Codex CLI auto-approve permissions for safe, read-only operations.
# Merged into ~/.codex/config.toml during installation.
# See trusted-domains.json for the full domain allowlist.
#
# Codex uses filesystem + network scoping rather than per-command allowlisting.
# Read access is granted to project roots; write access remains gated.
# Network access is limited to a curated list of trusted domains.

# Keep approval prompts for write operations and dangerous commands.
# "on-request" means Codex will still ask before executing writes.
approval_policy = "on-request"

# Select the "default" permissions profile defined below. REQUIRED by the newer
# Codex permissions system: a config that defines [permissions.*] profiles but
# omits default_permissions fails to load with the error
# "config defines `[permissions]` profiles but does not set `default_permissions`".
default_permissions = "default"

[permissions.default.filesystem]
# ":minimal" is the documented set of system essentials. Without it the Linux sandbox
# exposes no system directory, so Codex cannot even find /bin/sh and every command fails
# (measured 2026-09-27, Codex CLI 0.157.1 on Ubuntu 24.04). ":workspace_roots" is the
# documented key for the open project; the previous ":project_roots" is not in the
# reference (https://learn.chatgpt.com/docs/config-file/config-reference, fetched 2026-09-27).
# Both grant read only; write remains blocked by default.
":minimal" = "read"
":workspace_roots" = "read"

[permissions.default.network]
# Limit network access to trusted documentation and registry domains.
enabled = true
mode = "limited"
allowed_domains = [
  # Code hosting
  "github.com",
  "raw.githubusercontent.com",
  "gist.github.com",
  "gitlab.com",
  "bitbucket.org",

