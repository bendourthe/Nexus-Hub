name: github-usage-monitor

# Path-filtered: runs only when the github-usage-monitor extension changes, so it
# costs action minutes only for that surface (mirrors codex-usage-monitor.yml).
# The extension is a Node/TypeScript VSIX with a Vitest suite; the repo-wide
# ci.yml covers Python only, so this workflow is the extension's gate.
#
# scripts/installer.{sh,ps1} are deliberately NOT trigger paths even though both
# install this extension. ci.yml runs on every non-docs change and already runs
# catalog/hooks/tests/test_installer_smoke.py, which is what asserts both shells
# build every monitor in the same order. Adding the installers here would spin up
# a Node runner to rebuild an unchanged VSIX on every installer edit.
on:
  push:
    branches: [main, develop]
    paths:
      - 'extensions/github-usage-monitor/**'
      - '.github/workflows/github-usage-monitor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/github-usage-monitor/**'
      - '.github/workflows/github-usage-monitor.yml'

# Read-only: the job builds and tests, and publishes nothing.
permissions:
  contents: read

# Cancel superseded runs of the same ref (the single largest action-minute saver).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/github-usage-monitor
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extensions/github-usage-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile (tsc)
        run: npm run compile

      - name: Unit tests with V8 coverage (Vitest)
        # vitest.config.mts carries the coverage thresholds, so a coverage
        # regression fails this step rather than being reported and ignored.
        run: npm run test:coverage

      - name: Package VSIX
        run: npm run package

      - name: Verify packaged contents
        # Required runtime assets present; coverage reports, sources, tests, and
        # credential-shaped files absent.
        run: npm run verify:package
