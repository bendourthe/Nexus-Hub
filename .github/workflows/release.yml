name: Release

# v4.0.0: the release event, and only the release profile.
#
# Before v4.0.0 a `vX.Y.Z` tag ran the ENTIRE ci.yml validation suite, including
# its matrix legs. That is a third full run of a tree the pull request and the
# merge had already validated, on the one event where a failure can no longer
# prevent anything: the tag exists, and by convention it is not moved.
#
# What genuinely depends on the tag is packaging and publication readiness, so
# that is all this workflow runs.
#
# The tag is created and pushed by `/update release`, which owns its own
# confirmation gates and starts only after the integration result is green and
# merged. This workflow never creates a tag and never publishes a Release; it
# reports whether the tagged tree is fit to publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to check (defaults to the triggering ref)'
        required: false
        type: string

permissions:
  contents: read

# Deliberately NO cancel-in-progress. Cancelling pull-request validation is
# correct because a later commit supersedes an earlier one; cancelling a release
# operation is not, because each tag is a distinct artifact and there is no
# later run that covers the earlier tag. The group is per-ref so two tags never
# serialize behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history: the branch and repository-settings report in the
          # release profile compares refs, which a shallow clone cannot do.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Release profile
        # Version sync across every version-carrying surface, platform
        # read-contract freshness for the version being cut, and an advisory
        # branch and repository-settings report. NOT a validation re-run: the
        # profile contains no test suite, and tests/ci asserts that it does not.
        run: python scripts/ci/run.py --profile release --reports-dir reports

      - name: Publish the run summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Report the tagged version
        if: always()
        run: |
          set -uo pipefail
          version="$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])" 2>/dev/null || echo unknown)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tagged release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${GITHUB_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- plugin.json version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          exit 0
