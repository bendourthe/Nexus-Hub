# Presentify extractor verification (v3.12.0 Phase 6, resolves MT-1).
#
# Path-filtered so it costs action minutes ONLY when the presentify skill's
# bundled scripts (or this suite) change - the extractor is ~1200 lines of
# parsing logic whose fixture suite (45 checks) and design-entropy suite
# (10 checks) were previously manual-only. Ubuntu-only, single job, pip
# cached, concurrency-cancelled: the minimal footprint that still gates the
# high-risk surface.

name: Presentify extractor

on:
  push:
    branches: [main, develop]
    paths:
      - 'catalog/skills/specialized-domains/document-to-interactive-html/scripts/**'
      - 'docs/v3/v3.12/development/fixtures/gen_fixtures.py'
      - 'docs/v3/v3.12/development/fixtures/verify_phase1.py'
      - 'docs/v3/v3.12/development/fixtures/enrich_models.py'
      - 'docs/v3/v3.12/development/fixtures/verify_design_seed.py'
      - 'docs/v3/v3.13/development/fixtures/verify_universal_ingestion.py'
      - '.github/workflows/presentify-extractor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'catalog/skills/specialized-domains/document-to-interactive-html/scripts/**'
      - 'docs/v3/v3.12/development/fixtures/gen_fixtures.py'
      - 'docs/v3/v3.12/development/fixtures/verify_phase1.py'
      - 'docs/v3/v3.12/development/fixtures/enrich_models.py'
      - 'docs/v3/v3.12/development/fixtures/verify_design_seed.py'
      - 'docs/v3/v3.13/development/fixtures/verify_universal_ingestion.py'
      - '.github/workflows/presentify-extractor.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/presentify-extractor.yml'

      - name: Install extractor + fixture dependencies
        run: >
          pip install python-pptx python-docx openpyxl pdfplumber pypdf
          pypdfium2 Pillow reportlab rapidocr-onnxruntime ruff

      - name: Lint the bundled scripts
        run: ruff check catalog/skills/specialized-domains/document-to-interactive-html/scripts/

      - name: Generate fixtures
        run: python docs/v3/v3.12/development/fixtures/gen_fixtures.py

      - name: Run the extraction-fidelity suite (45 checks)
        run: python docs/v3/v3.12/development/fixtures/verify_phase1.py

      - name: Run the protocol round-trip
        run: python docs/v3/v3.12/development/fixtures/enrich_models.py

      - name: Run the design-entropy suite (10 checks)
        run: python docs/v3/v3.12/development/fixtures/verify_design_seed.py

      - name: Run the v3.13 universal-ingestion suite (28 checks)
        run: python docs/v3/v3.13/development/fixtures/verify_universal_ingestion.py
