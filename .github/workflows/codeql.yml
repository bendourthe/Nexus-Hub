name: CodeQL Security Scan

# v4.0.0 event separation. Two changes:
#
# 1. Analysis moved to the integration PULL REQUEST. It previously ran on `push`
#    to `main` only, so a pull request into `develop` got no CodeQL signal and
#    the analysis landed two merges after the code did. A finding that arrives
#    after the merge is an incident; before the merge it is a review comment.
# 2. The push-to-main leg is gone. It was a third analysis of a tree the pull
#    request and the merge had already covered.
#
# The weekly schedule STAYS, and is the one legitimate re-analysis of an
# unchanged tree: CodeQL query packs are updated on GitHub's clock, so a
# scheduled run tests the same code against a world that has changed. That is
# the exception the lifecycle contract carves out for scheduled work.
#
# This workflow publishes NO required status check, so the path filters below
# cannot strand one. They are kept because CodeQL is slow and genuinely
# irrelevant to a change that touches no analyzed language.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/**/*.py'
      - 'infrastructure/**/*.py'
      - 'extensions/**/*.ts'
      - 'extensions/**/*.js'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

# v4.0.0: explicit workflow-level default. The `analyze` job already narrowed
# itself to `security-events: write`, so the effective permission was already
# bounded -- but a job added later would have inherited the repository default
# silently. Least privilege has to be the default, not an override.
permissions:
  contents: read

# v3.11.0 Phase 8.4: cancel superseded runs of the same ref so rapid pushes to
# main do not stack redundant (and slow) CodeQL analyses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up provisioned CodeQL CLI
        id: codeql
        uses: github/codeql-action/setup-codeql@24c54180a607b1449ed407dd24f251e4e9147c8d # v4, experimental; hosted proof required before merge

      - name: Perform native CodeQL Analysis
        env:
          NEXUS_CI_CODEQL: ${{ steps.codeql.outputs.codeql-path }}
        run: python -B scripts/ci/run.py --profile full --only codeql-${{ matrix.language }} --reports-dir reports

      - name: Select validated current SARIF
        id: audit_report
        env:
          AUDIT_LANGUAGE: ${{ matrix.language }}
        run: |
          python -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from scripts.ci.reporting import audit_upload_path
          scope = "codeql-" + os.environ["AUDIT_LANGUAGE"]
          path = audit_upload_path(Path("reports"), scope, Path.cwd())
          marker = Path("reports/security") / (scope + ".manifest.json")
          raw = marker.read_bytes()
          manifest = json.loads(raw)
          actual = subprocess.check_output(["git", "rev-parse", "HEAD", "HEAD^{tree}"], text=True).splitlines()
          if actual != [manifest["source"]["head"], manifest["source"]["tree"]]:
              raise SystemExit("Source changed before upload")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("path=" + path.as_posix(), file=output)
              print("invocation_id=" + manifest["invocation_id"], file=output)
              print("manifest_sha256=" + hashlib.sha256(raw).hexdigest(), file=output)
          PY

      - name: Upload CodeQL SARIF
        id: upload
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: ${{ steps.audit_report.outputs.path }}
          category: "/language:${{ matrix.language }}"
          wait-for-processing: true

      - name: Retain hosted CodeQL observations
        env:
          AUDIT_LANGUAGE: ${{ matrix.language }}
          JOB_DISPLAY_NAME: Analyze (${{ matrix.language }})
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CODEQL_PATH: ${{ steps.codeql.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.codeql.outputs.codeql-version }}
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
          SARIF_IDS: ${{ steps.upload.outputs.sarif-ids }}
          INVOCATION_ID: ${{ steps.audit_report.outputs.invocation_id }}
          MANIFEST_SHA256: ${{ steps.audit_report.outputs.manifest_sha256 }}
        run: |
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          language = os.environ["AUDIT_LANGUAGE"]
          marker = Path("reports/security") / ("codeql-" + language + ".manifest.json")
          raw = marker.read_bytes()
          manifest = json.loads(raw)
          if hashlib.sha256(raw).hexdigest() != os.environ["MANIFEST_SHA256"] or manifest["invocation_id"] != os.environ["INVOCATION_ID"]:
              raise SystemExit("Invocation changed after upload")
          value = {"schema": "ci-codeql-hosted/1", "language": language, "source": manifest["source"],
                   "github": {"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                              "job_name": os.environ["JOB_DISPLAY_NAME"], "pr_number": os.environ.get("PR_NUMBER", ""),
                              "head_sha": os.environ.get("PR_HEAD", ""), "base_sha": os.environ.get("PR_BASE", "")},
                   "setup": {"codeql_path": os.environ["CODEQL_PATH"], "codeql_version": os.environ["CODEQL_VERSION"]},
                   "upload": {"sarif_id": os.environ["SARIF_ID"], "sarif_ids": os.environ["SARIF_IDS"]},
                   "invocation": {"invocation_id": manifest["invocation_id"], "manifest_sha256": hashlib.sha256(raw).hexdigest()},
                   "config_sha256": manifest["config_sha256"],
                   "workflow_sha256": hashlib.sha256(Path(".github/workflows/codeql.yml").read_bytes()).hexdigest()}
          destination = Path("reports/hosted")
          destination.mkdir(exist_ok=True)
          (destination / ("codeql-" + language + ".json")).write_text(json.dumps(value, indent=2), encoding="utf-8")
          PY

      - name: Publish native profile summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload native CodeQL reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-codeql-${{ matrix.language }}
          path: reports
          retention-days: 7
          if-no-files-found: warn
