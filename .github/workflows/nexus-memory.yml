name: nexus-memory

# Path-scoped feedback for the nexus-memory extension (v3.19.1 Phase 3).
# Triggers ONLY when the extension tree or this workflow changes. The
# comprehensive always-on gate remains the `tests` job in ci.yml. The
# multi-OS locking matrix is gated to merges into the protected branches
# (and workflow_dispatch), not every push.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-memory/**'
      - '.github/workflows/nexus-memory.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-memory/**'
      - '.github/workflows/nexus-memory.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'extensions/nexus-memory/pyproject.toml'
      - run: pip install -e "extensions/nexus-memory/[dev]"
      - run: python -m pytest extensions/nexus-memory/tests/ -q

  test-network-blocked:
    name: Test with outbound network blocked
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Build the offline test image
        run: |
          docker build --tag nexus-memory-offline --file - extensions/nexus-memory <<'DOCKERFILE'
          FROM python:3.11-slim
          WORKDIR /workspace
          COPY pyproject.toml README.md /package/
          COPY src /package/src
          COPY tests /package/tests
          RUN python -m pip install --no-cache-dir --editable "/package[dev]"
          DOCKERFILE
      - name: Full suite with egress denied
        run: |
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            nexus-memory-offline bash -c '
            set -euo pipefail
            test -d /sys/class/net/lo
            ! find /sys/class/net -mindepth 1 -maxdepth 1 ! -name lo -print -quit | grep -q .
            python -m pytest extensions/nexus-memory/tests/ -q -p no:cacheprovider
          '

  test-locking-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'extensions/nexus-memory/pyproject.toml'
      - run: pip install -e "extensions/nexus-memory/[dev]"
      - run: python -m pytest extensions/nexus-memory/tests/ -q
