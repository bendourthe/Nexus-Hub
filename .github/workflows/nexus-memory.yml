name: nexus-memory

# Path-scoped feedback for the nexus-memory extension (v3.19.1 Phase 3).
# Triggers ONLY when the extension tree or this workflow changes. The
# comprehensive always-on gate remains the `tests` job in ci.yml. The
# multi-OS locking matrix is gated to merges into the protected branches
# (and workflow_dispatch), not every push.
on:
  workflow_dispatch:
  # v4.0.0 event separation: the `push` leg to the same protected branches was
  # removed. Under a pull-request-only merge policy that push IS the merge commit
  # of the pull request that just ran, so the tree is identical and the second run
  # cannot discover anything the first did not. See
  # docs/policy/ci-cd-lifecycle-contract.md section 4.
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-memory/**'
      - '.github/workflows/nexus-memory.yml'
      - 'scripts/ci/**'
      - 'scripts/ci/requirements.in'
      - 'scripts/ci/requirements-py311.txt'

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/ci/requirements-py311.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            extensions/nexus-memory/pyproject.toml
            scripts/ci/requirements-py311.txt
      - run: pip install -e "extensions/nexus-memory/[dev]"
      - name: Repository-native memory-tests profile
        run: python scripts/ci/run.py --profile full --only memory-tests --reports-dir reports

      - name: Publish native profile summary
        if: always()
        shell: bash
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Retain native profile reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-native-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  test-network-blocked:
    name: Test with outbound network blocked
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Repository-native memory-offline profile
        run: python scripts/ci/run.py --profile full --only memory-offline --reports-dir reports

      - name: Publish native profile summary
        if: always()
        shell: bash
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Retain native profile reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-offline-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  test-locking-matrix:
    # v4.0.0: was gated on `push` to a protected branch, which this workflow no
    # longer receives. Left gated on a push condition it can never satisfy, the
    # three-OS locking matrix would have silently stopped running -- a skip that
    # reports Success and proves nothing. It now runs on the integration pull
    # request, which is where cross-platform proof belongs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Enable Git long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            extensions/nexus-memory/pyproject.toml
            scripts/ci/requirements-py311.txt
      - run: pip install -e "extensions/nexus-memory/[dev]"
      - name: Repository-native memory-tests profile
        run: python scripts/ci/run.py --profile full --only memory-tests --reports-dir reports

      - name: Publish native profile summary
        if: always()
        shell: bash
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Retain native profile reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-locking-reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  memory-required:
    needs: [test, test-network-blocked, test-locking-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native validation result
        env:
          R_test: ${{ needs.test.result }}
          R_offline: ${{ needs['test-network-blocked'].result }}
          R_locking: ${{ needs['test-locking-matrix'].result }}
        run: |
          set -euo pipefail
          for result in "$R_test" "$R_offline" "$R_locking"; do
            test "$result" = success
          done
