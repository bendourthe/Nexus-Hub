name: nexus-memory

# Path-scoped feedback for the nexus-memory extension (v3.19.1 Phase 3).
# Triggers ONLY when the extension tree or this workflow changes. The
# comprehensive always-on gate remains the `tests` job in ci.yml. The
# multi-OS locking matrix is gated to merges into the protected branches
# (and workflow_dispatch), not every push.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-memory/**'
      - '.github/workflows/nexus-memory.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-memory/**'
      - '.github/workflows/nexus-memory.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'extensions/nexus-memory/pyproject.toml'
      - run: pip install -e "extensions/nexus-memory/[dev]"
      - run: python -m pytest extensions/nexus-memory/tests/ -q

  test-locking-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'extensions/nexus-memory/pyproject.toml'
      - run: pip install -e "extensions/nexus-memory/[dev]"
      - run: python -m pytest extensions/nexus-memory/tests/ -q
