name: CI

# v4.0.0: the ONE comprehensive validation gate, and the only one.
#
# It runs on the integration pull request and (where a merge queue is enabled)
# on the queued merge result. It deliberately does NOT run on `push` to a
# protected branch any more.
#
# Why the push trigger is gone. Under a pull-request-only merge policy, a push
# to `develop` IS the merge commit of the pull request that just ran, so the
# tree is identical and the second run cannot discover anything the first did
# not. Worse, the push leg was where the expensive matrix legs were enabled, so
# the redundant run cost MORE than the useful one. Post-merge work now lives in
# post-merge.yml and release work in release.yml, each doing only what depends
# on the merged or tagged state.
#
# Why the expensive legs moved to the pull request. Windows PowerShell 5.1 and
# macOS compatibility used to be proven only AFTER merge. That did not save the
# minutes, it spent them at the moment they could no longer prevent a bad merge.
# If a leg is worth running at all it runs before the merge; if it is not, it
# should be deleted.
#
# Why the triggers are UNFILTERED. `validate`, `shellcheck`, and `ci-required`
# are required status checks. GitHub leaves a required check from an untriggered
# workflow Pending forever, so a workflow-level `paths:` filter makes a
# docs-only PR unmergeable without an administrator bypass -- which is what
# shipping v3.17.5 took, seven times in one day. A job SKIPPED by an `if:`
# reports Success. The identical path scoping therefore lives in the `changes`
# job below and is applied per job. See:
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks
#
# Why the jobs call scripts/ci/run.py instead of listing validators. The
# definitive command list lives in scripts/ci/profiles.py, so a developer
# running `make ci-full` and this workflow execute the same thing. The previous
# shape re-declared the Makefile's sequence as 31 separate steps, and the two
# had already diverged in production: a duplicate YAML key silently dropped
# validate_no_personal_paths.py from CI while the local list still ran it.
on:
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

# Least privilege. This workflow builds and tests only -- no artifact upload,
# no gh CLI, no comments, no pushes -- so read-only contents is the complete
# requirement.
permissions:
  contents: read

# Cancel superseded runs of the same ref (the single largest action-minute
# saver) so only the latest commit on a pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path scoping that must never sit on the triggers above.
  #
  # It answers ONE question: does this change touch anything outside ignorable
  # documentation prose? The re-inclusions below are NOT prose exceptions; each
  # is a docs path that a guard or a test READS, so editing it must run the
  # thing that reads it:
  #
  #   docs/policy/**   validator INPUT: platform-read-contracts.json feeds
  #                    verify_platform_contracts.py and the freshness gate,
  #                    platform-defaults-levers.md feeds the lever tests,
  #                    required-checks.json feeds check_required_check_coverage.py,
  #                    and doc-budgets.json feeds validate_doc_budgets.py.
  #   docs/v*/*/development/*.md
  #                    per-version development CONTRACT docs that tests read.
  #                    Scoped to *.md DIRECTLY under a development/ dir on
  #                    purpose: a `*` never crosses a `/`, so this matches the
  #                    contract docs and NOT development/history/*.md. Session
  #                    histories are frozen records no test reads.
  #   docs/incidents/**, docs/decisions/**
  #                    validator INPUT for check_incident_notes.py and
  #                    validate_decision_records.py.
  #
  # FAIL CLOSED is the whole contract of this job. Under the old trigger filter
  # a detection mistake meant the workflow did not start, which was loud
  # (Pending forever). Here a mistake would SKIP a job, and a skipped job
  # reports Success -- silent. So `relevant` is only ever set false by a
  # complete, successful classification; the step cannot exit non-zero; and
  # every consumer is written as `!cancelled() && ... != 'false'` so a crashed
  # or missing output still RUNS the job. Both halves are load-bearing:
  # `!cancelled()` overrides GitHub's skip-on-failed-dependency rule, and
  # `!= 'false'` treats the empty output of a failed job as "run".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history: the classification diffs against the PR base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e`: every failure path below must fall
          # through to the fail-closed default rather than abort the step.
          relevant=true
          reason="default (fail closed)"
          nul="0000000000000000000000000000000000000000"

          case "${EVENT_NAME}" in
            pull_request) base="${BASE_SHA}" ;;
            *)            base="" ;;
          esac

          if [ -z "${base}" ] || [ "${base}" = "${nul}" ]; then
            reason="no usable base sha for event ${EVENT_NAME}"
          elif ! files=$(git diff --name-only "${base}" HEAD 2>/dev/null); then
            reason="git diff ${base}..HEAD failed"
          elif [ -z "${files}" ]; then
            reason="empty diff against ${base}"
          elif printf '%s\n' "${files}" | grep -qvE '^docs/'; then
            reason="change touches a non-docs path"
          elif printf '%s\n' "${files}" | grep -qE '^docs/(policy|incidents|decisions)/'; then
            reason="change touches a validator-input docs path"
          elif printf '%s\n' "${files}" | grep -qE '^docs/(releases/)?[^/]+/[^/]+/development/[^/]+\.md$'; then
            reason="change touches a development contract doc"
          else
            relevant=false
            reason="every changed path is ignorable documentation prose"
          fi

          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "relevant=${relevant} -- ${reason}"
          printf '%s\n' "${files:-}" | sed 's/^/  changed: /'
          exit 0

  validate:
    # Required status check. Runs unconditionally so it can never sit Pending.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.pre-commit-config.yaml'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (standard checks only)
        # Skip local Python hooks that require project-specific tooling.
        # lint-templates and build-catalogs are enforced on commit locally.
        run: SKIP=lint-templates,build-catalogs pre-commit run --all-files

      - name: Repository-native validation profile
        # One call. The validator list lives in scripts/ci/profiles.py and is
        # the same list `make ci-full` runs. Adding a validator needs no edit
        # here.
        #
        # One deliberate omission, restated here because it is an ABSENCE and an
        # unexplained absence reads as an oversight. The profile runs
        # verify_model_prompting_profiles.py (the per-model prompting layer's
        # STRUCTURE) but NOT check_model_prompting_freshness.py (its FRESHNESS).
        # Freshness is advisory by design: models ship on the vendor's clock, and
        # gating it would let a model released on a Tuesday wedge every release
        # until someone ran a research swarm. It runs as an advisory step in
        # `/update release` instead. Contrast the platform read-contract
        # freshness gate, which DOES gate because it must be re-verified for the
        # release being cut.
        run: |
          python scripts/ci/run.py --profile full \
            --only catalog-parse,hygiene,catalog,security,workflows,platform-contracts,docs,version \
            --reports-dir reports

      - name: Publish the run summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  shellcheck:
    # Required status check. Runs unconditionally.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint catalog shell scripts
        # Not in the profile: the catalog glob is a repository-shaped check
        # rather than a named command, and it is cheap enough to inline.
        run: find catalog -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Shell and PowerShell profile groups
        # shell-lint runs shellcheck over the installers; powershell-parse is
        # the unconditional AST syntax floor over every catalog and scripts
        # *.ps1 plus the root bootstrap. The ubuntu runner carries pwsh 7, so
        # the parse runs here at 1x rather than on a 2x Windows runner. The
        # 5.1 BEHAVIOR leg is a different claim and lives in tests-windows.
        run: |
          python scripts/ci/run.py --profile platform \
            --only shell-lint,powershell-parse --reports-dir reports

      - name: Publish the run summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  tests:
    # Each pytest invocation is scoped to its own tree so pytest does not adopt
    # a nested pyproject.toml as rootdir, which previously broke module
    # discovery. The profile preserves that scoping.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'extensions/*/pyproject.toml'

      - name: Install test dependencies
        # tomlkit and PyYAML are the optional seeding dependencies for platform
        # install-time defaults. They are installed here because the seeding
        # tests use pytest.importorskip, so without them the TOML and YAML
        # coverage would SILENTLY SKIP -- a green run proving nothing about two
        # of the four writable formats.
        run: pip install pytest tomlkit PyYAML

      - name: Install extension packages
        run: |
          pip install -e "extensions/nexus-skill-server/[dev]"
          pip install -e "extensions/nexus-code-search/[dev]"
          pip install -e "extensions/nexus-web-fetch/[dev]"
          pip install -e "extensions/nexus-skill-scanner/[dev]"
          pip install -e "extensions/nexus-context-compressor/[dev]"
          pip install -e "extensions/nexus-memory/[dev]"

      - name: Test profile groups
        # `tests` runs the WHOLE catalog/hooks/tests and tests/ trees rather
        # than enumerating directories. The enumeration was a standing
        # fail-open: a new directory was invisible to CI until someone
        # remembered to add a step, and tests/plans shipped in exactly that
        # state. tests/workflows/test_ci_runs_every_repo_test.py holds the
        # property so the enumeration cannot come back by accident.
        run: |
          python scripts/ci/run.py --profile full \
            --only tests,extension-tests --reports-dir reports

      - name: Publish the run summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  guide-render:
    # The complete repo test job intentionally carries no browser, so the
    # guide's browser contracts skip-with-note there. This focused job installs
    # Chromium and turns those same skips into failures, closing the MT-1 gap
    # without adding a browser download to every test run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/ci.yml'

      - name: Install guide render test dependencies
        run: pip install pytest playwright

      # Chromium is about 130 MB. Key the cache to Playwright's resolved
      # version so a browser revision is reused only by the matching client.
      - name: Resolve the Playwright version for the cache key
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run guide and visual detector browser contracts
        # A missing or unlaunchable browser must fail this job, never degrade to
        # a quiet skip inside an otherwise green test run.
        env:
          NEXUS_REQUIRE_RENDER: '1'
        run: python -m pytest -q tests/guides/ tests/verification/test_visual_defect_detector.py

  tests-windows:
    # Windows PowerShell 5.1 BEHAVIOR, which pwsh 7 cannot substitute for.
    #
    # Evidence-driven, not belt-and-braces: the v3.15.6 provenance ledger
    # shipped a defect where `Add-Content -Encoding utf8` emits a UTF-8 BOM.
    # That behavior is specific to 5.1 and does NOT reproduce under pwsh 7, so
    # the ubuntu leg would have passed a ledger whose first field was
    # unparseable on every Windows user's machine.
    #
    # v4.0.0: this now runs on the PULL REQUEST rather than only on push.
    # Windows is a 2x-minute runner, and this is exactly the cost worth paying
    # before a merge rather than after it.
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/ci.yml'

      - name: Install test dependencies
        run: pip install pytest PyYAML

      - name: Windows platform profile group
        # NEXUS_TEST_POWERSHELL is pinned inside the profile definition, not
        # here, so a developer running `make ci-platform` on Windows gets the
        # same edition under test as CI does.
        run: python scripts/ci/run.py --profile platform --only windows-hooks --reports-dir reports

      - name: Codex, Copilot, Kimi, Gemini CLI, and Qwen native delivery on Windows
        # Scoped to the integration files whose behavior is Windows-specific
        # (commandWindows registration, host-selected .ps1, config.toml marker
        # splice, user-profile agent dirs). Running all of tests/integrations
        # here would add Windows runner time for coverage the ubuntu job
        # already provides.
        env:
          NEXUS_TEST_POWERSHELL: powershell
        run: |
          python -m pytest tests/integrations/test_codex_native.py `
                           tests/integrations/test_copilot_hermes_native.py `
                           tests/integrations/test_kimi_native.py `
                           tests/integrations/test_settings_hooks.py `
                           tests/integrations/test_catalog_adapters.py `
                           tests/integrations/test_codex_invocation_policy.py -q

      - name: Publish the run summary
        if: always()
        shell: bash
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  bootstrap:
    # Exercise the dual-mode self-fetching bootstrap end to end on a clean
    # machine (no pre-existing clone). The bash entry point runs the FULL
    # install from a GitHub-shaped tarball of the checkout and asserts a working
    # `nexus-hub --version`; the PowerShell entry point is AST-parsed and
    # precheck-run via pwsh here (the full Windows install runs in
    # bootstrap-windows below).
    #
    # The macOS leg is bash-3.2-safe (no associative arrays, mapfile, or
    # case-mod expansions), so the same code path runs on the BSD-userland
    # runner. ubuntu remains the authoritative bash gate for the ordinary
    # reason that it is the reference POSIX environment.
    #
    # v4.0.0: the macOS leg moved from push to the pull request. macOS is a
    # 10x-minute runner and this is the one leg where that cost buys real
    # pre-merge proof.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build a GitHub-shaped catalog tarball from the checkout
        run: git archive --format=tar.gz --prefix=Nexus-Hub-main/ -o "$RUNNER_TEMP/catalog.tar.gz" HEAD

      - name: bash standalone bootstrap end-to-end (no prior clone) + nexus-hub --version
        run: |
          set -uo pipefail
          # macOS mktemp needs an explicit template; this form is GNU- and BSD-safe.
          home="$(mktemp -d "${TMPDIR:-/tmp}/nexus-ci.XXXXXX")/home"
          mkdir -p "$home"
          HOME="$home" NEXUS_HUB_FORCE_STANDALONE=1 NEXUS_HUB_TARBALL="$RUNNER_TEMP/catalog.tar.gz" \
            bash install.sh < /dev/null || echo "core installer exited non-zero (rc=$?); asserting artifacts"
          test -f "$home/.nexus-hub/src/scripts/installer.sh" \
            || { echo "FAIL: bootstrap did not extract the catalog to ~/.nexus-hub/src"; exit 1; }
          test -d "$home/.nexus-hub" \
            || { echo "FAIL: ~/.nexus-hub not populated"; exit 1; }
          echo "OK: standalone bootstrap populated $home/.nexus-hub"
          launcher="$home/.nexus-hub/bin/nexus-hub"
          core="$home/.nexus-hub/src/scripts/nexus_hub_cli.py"
          export NEXUS_HUB_HOME="$home/.nexus-hub"
          if [ -x "$launcher" ]; then
            ver="$("$launcher" --version)" \
              || { echo "FAIL: nexus-hub launcher --version exited non-zero"; exit 1; }
            echo "launcher: $ver"
          elif [ -f "$core" ]; then
            echo "WARN: launcher not installed; checking the extracted CLI core"
            ver="$(python3 "$core" --version)" \
              || { echo "FAIL: nexus_hub_cli.py --version exited non-zero"; exit 1; }
            echo "core: $ver"
          else
            echo "FAIL: neither the nexus-hub launcher nor the CLI core is present"; exit 1
          fi
          printf '%s\n' "$ver" | grep -qE 'nexus-hub [0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "FAIL: unexpected --version output: $ver"; exit 1; }
          echo "OK: nexus-hub --version works ($ver)"

      - name: bash missing-tool simulation exits non-zero with a clear message
        run: |
          set -uo pipefail
          bash_bin="$(command -v bash)"
          out="$(PATH='' NEXUS_HUB_FORCE_STANDALONE=1 "$bash_bin" install.sh 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          test "$rc" -ne 0 || { echo "FAIL: expected a non-zero exit"; exit 1; }
          printf '%s\n' "$out" | grep -qi curl || { echo "FAIL: message did not name curl/wget"; exit 1; }
          echo "OK: missing-tool path exits $rc with a clear message"

      - name: PowerShell bootstrap AST parse + precheck (pwsh)
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "install.ps1 AST OK"
          $env:NEXUS_HUB_FORCE_STANDALONE = '1'
          $env:NEXUS_HUB_PRECHECK_ONLY = '1'
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: precheck exit $LASTEXITCODE"; exit 1 }
          Write-Host "OK: pwsh precheck passed"

  bootstrap-windows:
    # The `irm | iex` standalone flow is a Windows-native path that only a
    # Windows runner exercises. It drives install.ps1 in forced-standalone mode
    # against a GitHub-shaped tarball of the checkout (zero network), then
    # asserts a populated ~/.nexus-hub and a working `nexus-hub --version`.
    #
    # v4.0.0: moved from push-only to the pull request, for the same reason as
    # tests-windows. An installer failure discovered after merge is an incident;
    # before merge it is a review comment.
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build a GitHub-shaped catalog tarball from the checkout
        shell: bash
        run: git archive --format=tar.gz --prefix=Nexus-Hub-main/ -o "$RUNNER_TEMP/catalog.tar.gz" HEAD

      - name: PowerShell standalone bootstrap end-to-end + nexus-hub --version
        shell: powershell
        run: |
          $nxHome = Join-Path $env:RUNNER_TEMP ("nexus-home-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $nxHome | Out-Null
          $env:USERPROFILE = $nxHome
          $env:HOME = $nxHome
          $env:NEXUS_HUB_FORCE_STANDALONE = '1'
          $env:NEXUS_HUB_TARBALL = (Join-Path $env:RUNNER_TEMP 'catalog.tar.gz')
          # Windows PowerShell 5.1 is the documented floor and the `irm | iex`
          # default on Windows. Tolerate the core installer's exit code; the
          # extraction and version assertions below are the real gate.
          & .\install.ps1
          Write-Host "bootstrap rc=$LASTEXITCODE (asserting artifacts below)"
          $nx = Join-Path $nxHome '.nexus-hub'
          if (-not (Test-Path (Join-Path $nx 'src\scripts\installer.ps1'))) { Write-Host 'FAIL: bootstrap did not extract the catalog to ~/.nexus-hub/src'; exit 1 }
          if (-not (Test-Path $nx)) { Write-Host 'FAIL: ~/.nexus-hub not populated'; exit 1 }
          Write-Host "OK: standalone bootstrap populated $nx"
          $env:NEXUS_HUB_HOME = $nx
          $launcher = Join-Path $nx 'bin\nexus-hub.cmd'
          $core = Join-Path $nx 'src\scripts\nexus_hub_cli.py'
          if (Test-Path $launcher) {
            $ver = (& $launcher --version | Out-String).Trim()
            Write-Host "launcher: $ver"
          } elseif (Test-Path $core) {
            Write-Host 'WARN: launcher not installed; checking the extracted CLI core'
            $ver = (& python $core --version | Out-String).Trim()
            Write-Host "core: $ver"
          } else {
            Write-Host 'FAIL: neither the nexus-hub launcher nor the CLI core is present'; exit 1
          }
          if ("$ver" -notmatch 'nexus-hub \d+\.\d+\.\d+') { Write-Host "FAIL: unexpected --version output: $ver"; exit 1 }
          Write-Host "OK: nexus-hub --version works ($ver)"

  install-smoke:
    # Prove the catalog lands at each platform's real read-path and that the
    # project auto-seed produces .agents/workflows. Uses the registry installer
    # (a fast, deterministic file mirror -- no MCP, no venv) so it runs cheaply
    # on every OS.
    #
    # v4.0.0: the full three-OS matrix now runs on the pull request.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Global registry install into a throwaway HOME, then verify read-paths (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          home="$(mktemp -d "${TMPDIR:-/tmp}/nx-smoke.XXXXXX")/home"
          mkdir -p "$home"
          HOME="$home" python scripts/lib/integrations/runner.py install --scope global \
            --integrations claude,codex,gemini,antigravity2,opencode --overwrite --quiet
          out="$(HOME="$home" python scripts/lib/integrations/runner.py verify --target "$home" 2>&1 || true)"
          printf '%s\n' "$out"
          for expect in \
            "Claude -- commands:ok, skills:ok" \
            "Codex / ChatGPT -- ~/.agents/skills:ok" \
            "Gemini IDE -- GEMINI.md:ok" \
            "Antigravity 2.0 IDE (global) -- skills:ok" \
            "OpenCode -- skills:ok"; do
            printf '%s\n' "$out" | grep -qF "$expect" \
              || { echo "FAIL: read-path not populated: $expect"; exit 1; }
          done
          echo "OK: global platform read-paths populated on ${{ matrix.os }}"

      - name: Project auto-seed smoke (Linux only) - init seeds .agents/workflows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          repo="$(mktemp -d "${TMPDIR:-/tmp}/nx-proj.XXXXXX")/proj"
          mkdir -p "$repo"
          git -C "$repo" init -q
          python scripts/lib/integrations/runner.py init --target "$repo" --quiet
          test -n "$(ls -A "$repo/.agents/workflows" 2>/dev/null)" \
            || { echo "FAIL: init did not populate .agents/workflows in the current repo"; exit 1; }
          echo "OK: project auto-seed populated .agents/workflows"

      - name: Global registry install into a throwaway HOME, then verify read-paths (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP ("nx-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          $env:USERPROFILE = $h; $env:HOME = $h
          & python scripts\lib\integrations\runner.py install --scope global --integrations claude,codex,gemini,antigravity2,opencode --overwrite --quiet
          $out = (& python scripts\lib\integrations\runner.py verify --target $h | Out-String)
          Write-Host $out
          foreach ($expect in @(
            "Claude -- commands:ok, skills:ok",
            "Codex / ChatGPT -- ~/.agents/skills:ok",
            "Gemini IDE -- GEMINI.md:ok",
            "Antigravity 2.0 IDE (global) -- skills:ok",
            "OpenCode -- skills:ok")) {
            if ($out -notmatch [regex]::Escape($expect)) { Write-Host "FAIL: read-path not populated: $expect"; exit 1 }
          }
          Write-Host "OK: global platform read-paths populated (Windows)"

  installer-smoke:
    # Run the REAL platform-native installers into redirected HOME and workspace
    # roots, then use one shared Python checker for identical postconditions on
    # every OS. GitHub-hosted runners are deliberate: contributors install no
    # hypervisor, and containers cannot provide a real macOS or Windows kernel.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Real workspace install and shared assertions (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/nexus-installer-smoke"
          home="$smoke_root/home"
          workspace="$smoke_root/workspace"
          mkdir -p "$home" "$workspace"
          HOME="$home" USERPROFILE="$home" NEXUS_HUB_HOME="$home/.nexus-hub" \
            python scripts/nexus_hub_cli.py org connect "$PWD/configs/examples/org-bundle-example" --force
          HOME="$home" USERPROFILE="$home" NEXUS_HUB_NO_AUTOSEED=1 \
            bash scripts/installer.sh --workspace "$workspace" --platforms claude --yes
          HOME="$home" USERPROFILE="$home" NEXUS_HUB_HOME="$home/.nexus-hub" \
            python scripts/check_installer_smoke.py --home "$home" --workspace "$workspace"

      - name: Real workspace install and shared assertions (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'nexus-installer-smoke'
          $smokeHome = Join-Path $smokeRoot 'home'
          $workspace = Join-Path $smokeRoot 'workspace'
          New-Item -ItemType Directory -Force -Path $smokeHome, $workspace | Out-Null
          $env:USERPROFILE = $smokeHome
          $env:HOME = $smokeHome
          $env:NEXUS_HUB_HOME = Join-Path $smokeHome '.nexus-hub'
          $env:NEXUS_HUB_NO_AUTOSEED = '1'
          $orgBundle = (Resolve-Path 'configs\examples\org-bundle-example').Path
          & python scripts\nexus_hub_cli.py org connect $orgBundle --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\installer.ps1 -Workspace $workspace -Platforms claude -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts\check_installer_smoke.py --home $smokeHome --workspace $workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ONE aggregate required context for the whole workflow.
  #
  # GitHub evaluates a job-level `if:` BEFORE matrix expansion, so a SKIPPED
  # matrix job publishes exactly one check run named after the bare job. On a
  # docs-only proof PR the raw check-run API listed `installer-smoke`, never
  # `installer-smoke (ubuntu-latest)` and its siblings, so five of ten required
  # contexts never came into existence and sat Pending forever. The required set
  # therefore collapses to this single context plus `colocation` and `verify`.
  # Matrix jobs may skip freely, and a renamed matrix leg can no longer silently
  # drop a gate.
  #
  # SAFETY: this job is the only thing standing between a broken build and a
  # green merge, so every ambiguous case fails.
  #   - `if: always()` so it reports even when a needed job failed or the run
  #     was cancelled. Without it a failed dependency would SKIP this job, and a
  #     skipped required check reports Success -- the exact fail-open trap the
  #     rest of this workflow is built to avoid.
  #   - The verdict is an ALLOWLIST (`success` or `skipped` pass, everything
  #     else fails), not a denylist on `failure`/`cancelled`. A result value
  #     GitHub has not used before therefore fails closed.
  #   - Each result is passed as its own env var and checked in pure bash: no
  #     `jq`, no `python3`, nothing that could be absent on a runner or make the
  #     logic untestable off-CI.
  #   - `changes` is included on purpose: a broken detector still lets the gated
  #     jobs run (that is what `!cancelled()` buys them), but it must be LOUD
  #     rather than merely survivable.
  #
  # tests/validators/test_ci_required_gate.py asserts that `needs` covers every
  # other job AND that every needed job has a matching env var, so adding a job
  # without wiring it here fails rather than escaping the loop.
  ci-required:
    needs:
      - changes
      - validate
      - shellcheck
      - tests
      - guide-render
      - tests-windows
      - bootstrap
      - bootstrap-windows
      - install-smoke
      - installer-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every needed job succeeded or was legitimately skipped
        env:
          R_changes: ${{ needs.changes.result }}
          R_validate: ${{ needs.validate.result }}
          R_shellcheck: ${{ needs.shellcheck.result }}
          R_tests: ${{ needs.tests.result }}
          R_guide_render: ${{ needs['guide-render'].result }}
          R_tests_windows: ${{ needs['tests-windows'].result }}
          R_bootstrap: ${{ needs.bootstrap.result }}
          R_bootstrap_windows: ${{ needs['bootstrap-windows'].result }}
          R_install_smoke: ${{ needs['install-smoke'].result }}
          R_installer_smoke: ${{ needs['installer-smoke'].result }}
        run: |
          set -uo pipefail
          failed=""
          for var in $(env | sed -n 's/^\(R_[A-Za-z0-9_]*\)=.*/\1/p' | sort); do
            eval "result=\${${var}-}"
            # Report the REAL job name: env vars cannot contain a hyphen, so
            # `installer-smoke` arrives as R_installer_smoke and would otherwise
            # be printed as `installer_smoke` -- a name that matches no job and
            # sends whoever reads the failed run looking for the wrong thing.
            job=$(printf '%s' "${var#R_}" | tr '_' '-')
            printf '  %-22s %s\n' "${job}" "${result:-<empty>}"
            case "${result}" in
              success|skipped) ;;
              *) failed="${failed} ${job}=${result:-<empty>}" ;;
            esac
          done

          # No R_* variables at all would mean the loop asserted nothing, so it
          # is a failure rather than a vacuous pass.
          if [ -z "$(env | sed -n 's/^R_[A-Za-z0-9_]*=.*/x/p')" ]; then
            echo "FAIL: no job results were provided; refusing to pass vacuously"
            exit 1
          fi

          if [ -n "${failed}" ]; then
            echo "FAIL: a needed job did not succeed or skip --${failed}"
            exit 1
          fi

          echo "OK: every needed job succeeded or was legitimately skipped"
