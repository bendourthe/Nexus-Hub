name: CI

on:
  push:
    branches: [main, develop]
    # v3.11.0 Phase 8.4: docs-only pushes never affect validators, tests, or the
    # installer, so skip the full job set (incl. the 10x macOS / 2x Windows legs)
    # when a change touches nothing outside docs/. Skill/template/README/CHANGELOG
    # changes live OUTSIDE docs/ and still trigger the full run.
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'

# v3.11.0 Phase 7.5 / 8.4 CI optimization: cancel superseded runs of the same ref
# (the single largest action-minute saver) so only the latest push/PR commit runs.
# v3.15.8 Phase 9.3: least privilege. This workflow builds and tests only --
# no artifact upload, no gh CLI, no comments, no pushes -- so read-only
# contents is the complete requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          # v3.11.0 Phase 8.4: cache pip downloads keyed on the hook config so the
          # pre-commit install is not fetched cold on every run.
          cache: 'pip'
          cache-dependency-path: '.pre-commit-config.yaml'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (standard checks only)
        # Skip local Python hooks that require project-specific tooling.
        # lint-templates and build-catalogs are enforced on commit locally.
        run: SKIP=lint-templates,build-catalogs pre-commit run --all-files

      - name: Validate skills.json
        run: python -c "import json; d = json.load(open('data/skills.json')); print(f'skills.json OK — {len(d[\"skills\"])} skills')"

      - name: Validate workflows.json
        run: python -c "import json; d = json.load(open('data/workflows.json')); print(f'workflows.json OK — {len(d[\"workflows\"])} workflows')"

      - name: Validate bundles.json
        run: python -c "import json; d = json.load(open('data/bundles.json')); print(f'bundles.json OK — {len(d[\"bundles\"])} bundles')"

      - name: Validate skill catalog (bundle orphan audit) (v3.14.2 Phase 1)
        # Skill/command changes reach this job via the workflow's paths-ignore:
        # docs/** trigger (catalog/** is outside docs/), and the workflow-level
        # concurrency cancel-in-progress above supersedes stale runs. Uses
        # --bundles-only to match `make validate`: the strict single-line
        # frontmatter/description pass is transitional (grandfathered via
        # scripts/validate_skills.allowlist.json; the residual over-long
        # descriptions are tracked as a v3.14.2 known-gaps WN entry) and is not
        # yet green catalog-wide, so wiring the strict gate here would fail CI on
        # pre-existing drift unrelated to any given change.
        run: python scripts/validate_skills.py --bundles-only

      - name: Trigger-and-routing eval (description near-collision + routing gate) (v3.15.2)
        # Deterministic, model-free, stdlib-only HARD GATE: fails CI on any
        # un-allowlisted skill-description near-collision OR any per-skill
        # trigger-cases.json routing failure (mis-route / near-miss margin). The
        # intentional-neighbor allowlist (scripts/run_trigger_evals.allowlist.json)
        # covers by-design category siblings; skills without trigger-cases stay on
        # the WARN path and never fail the gate. Shipped WARNING-ONLY in v3.15.2
        # Phase 1 and PROMOTED to `--gate` in Phase 6 now that the catalog is clean
        # and allowlisted (0 un-allowlisted collisions, 0 routing failures). Reaches
        # this job via the workflow's paths-ignore: docs/** trigger (catalog/** and
        # scripts/** are outside docs/).
        run: python scripts/run_trigger_evals.py --gate

      - name: Validate no personal paths (v2.3.0 Phase 2)
        # v3.14.5 Phase 7: split out of the bundle-audit step above, which had a
        # duplicate `run:` key - YAML keeps only the last, so the bundle-orphan
        # audit was silently dropped in CI (present on develop too; not caused by
        # this release). Both now run as distinct steps, matching `make validate`.
        run: python scripts/validate_no_personal_paths.py

      - name: Validate Unicode safety (v2.3.0 Phase 2)
        run: |
          python scripts/validate_unicode_safety.py

      - name: Scan supply-chain IOCs (v2.3.0 Phase 2)
        run: python scripts/scan_supply_chain_iocs.py

      - name: Validate GitHub Actions workflow security (v2.3.0 Phase 2)
        run: python scripts/validate_workflow_security.py

      - name: Validate version sync across all surfaces (v3.0.0 Phase 1)
        run: python scripts/check_version_sync.py

      - name: Validate base-*.md lockstep parity (v3.6.0 Phase 2)
        # Structural parity guard over the five platform-agnostic instruction
        # templates (base-claude/codex/cursor/gemini/opencode). Fails if a
        # platform-agnostic edit (shared heading, placeholder, or invariant
        # block like the MCP Registry Policy) lands in a subset of the five.
        run: python scripts/check_base_template_parity.py

      - name: Validate per-model prompting profile layer (v3.15.5 Phase 1)
        # Structural gate on the model-prompting-research skill's profile layer:
        # the index parses, meta is well-typed, meta.roster_hash matches
        # meta.roster, every claim carries an allowed confidence/scope with no
        # unknown keys, and index models match references/models/*.md in both
        # directions. Mirrors the `make validate` step of the same name.
        #
        # Two deliberate omissions. (1) scripts/check_model_prompting_freshness.py
        # is NOT run here: roster staleness is advisory by design, and gating it
        # would let a vendor shipping a new model wedge every release. Contrast the
        # platform read-contract freshness gate immediately below, which DOES gate
        # because it must be re-verified for the release being cut. (2) No separate
        # path-filtered job for these two scripts: this job already runs on any
        # non-docs change (the workflow-level paths-ignore), so a dedicated job
        # would add a cold runner instead of saving minutes. Their pytests ride the
        # existing `tests/validators` step in the tests job.
        run: python scripts/verify_model_prompting_profiles.py

      - name: Validate platform read-contract freshness (v3.14.5 Phase 6)
        # Mandatory per-release gate: docs/policy/platform-read-contracts.json's
        # meta.verified_for_version must equal the plugin.json version being cut.
        # Green during development (both are the last-released version); fails a
        # release bump until the platform-contract-verification skill re-verifies
        # each platform's current discovery format and re-stamps the marker.
        run: python scripts/check_platform_contract_freshness.py

      - name: Scan catalog for skill-security findings (v3.0.0 Phase 6)
        # Deterministic static gate: fails on any HIGH/CRITICAL finding across
        # catalog/skills and catalog/mcp-configs. MEDIUM/LOW findings in a
        # producer catalog are expected and adjudicated by the
        # skill-security-scan skill, not the gate.
        run: python scripts/scan_skill_security.py catalog/skills catalog/mcp-configs --fail-on high

      - name: Compression accuracy-regression gate (v3.2.0 Phase 5)
        # Deterministic, offline structural-fidelity gate: fails if the
        # context-compressor stops reversing dropped spans exactly (CCR
        # round-trip), drops a code signature, or compresses below the
        # documented effectiveness floor. No live LLM call; the harness
        # bootstraps its own src/ so no package install is needed here.
        run: cd extensions/nexus-context-compressor && python -m evals --check

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint installer scripts
        run: |
          shellcheck --severity=warning scripts/installer.sh install.sh

      - name: Lint hook and per-skill scripts
        # v3.15.6 Phase 4 (QG-1): the `|| true` that used to terminate this line is
        # removed, so the catalog lint is a real gate. Safe as of this release:
        # all 36 catalog *.sh files pass --severity=warning with zero warnings, so
        # the gate starts green and any future regression fails CI instead of
        # scrolling past. If a legitimate warning ever needs accepting, add a
        # targeted `# shellcheck disable=` with a reason at the call site rather
        # than restoring the blanket `|| true`.
        run: |
          find catalog -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Parse catalog PowerShell hooks (v3.15.6 Phase 4)
        # v3.15.6 introduced the first catalog *.ps1 files carrying security logic
        # (escalation-trigger, git-guardrails, provenance-ledger). Their behavior is
        # covered by the parametrized hook tests, but those SKIP when no PowerShell
        # interpreter is present, and a skip emits no signal. This step is the
        # unconditional syntax floor: it fails on a parse error even if the runner
        # image ever drops pwsh.
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem catalog/hooks -Filter *.ps1 -File | ForEach-Object {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              Write-Host "FAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  bootstrap:
    # v3.7.0 Phase 1 + Phase 5: exercise the dual-mode self-fetching bootstrap
    # end-to-end on a clean machine (no pre-existing clone). The bash entry point
    # runs the FULL install from a GitHub-shaped tarball of the checkout and then
    # asserts a working `nexus-hub --version` (the Phase 5 DoD); the PowerShell
    # entry point is AST-parsed and precheck-run via pwsh here (the full Windows
    # install runs end-to-end in the bootstrap-windows job below).
    #
    # Phase 5 widens the bash path to a macOS runner as well as ubuntu: the
    # installer is bash-3.2-safe (no associative arrays / mapfile / case-mod
    # expansions), so the same code path runs on the BSD-userland macOS runner.
    # ubuntu remains the authoritative bash gate; macOS adds real-platform proof
    # that the Mac smoke test (docs/v3/v3.7/development/mac-smoke-test.md) used to
    # carry alone.
    #
    # This used to cite WN-v36-1 as "bash cannot be fully run on the Windows dev
    # host". That premise was DISPROVEN in v3.15.6 Phase 4: the cause was PATH
    # shadowing (the WSL launcher stub in System32 preceding Git Bash and unable to
    # resolve a Windows-style script path), not host incapability. ubuntu is still
    # the authoritative gate for the bash INSTALLER path, but for the ordinary
    # reason that it is the reference POSIX environment, not because Windows cannot
    # run bash.
    strategy:
      fail-fast: false
      matrix:
        # Cost control: PRs run ubuntu-only; the macOS leg (10x minutes) runs on
        # pushes to shared branches, where real-platform proof matters.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build a GitHub-shaped catalog tarball from the checkout
        run: git archive --format=tar.gz --prefix=Nexus-Hub-main/ -o "$RUNNER_TEMP/catalog.tar.gz" HEAD

      - name: bash standalone bootstrap end-to-end (no prior clone) + nexus-hub --version
        run: |
          set -uo pipefail
          # macOS mktemp needs an explicit template; this form is GNU- and BSD-safe.
          home="$(mktemp -d "${TMPDIR:-/tmp}/nexus-ci.XXXXXX")/home"
          mkdir -p "$home"
          HOME="$home" NEXUS_HUB_FORCE_STANDALONE=1 NEXUS_HUB_TARBALL="$RUNNER_TEMP/catalog.tar.gz" \
            bash install.sh < /dev/null || echo "core installer exited non-zero (rc=$?); asserting artifacts"
          test -f "$home/.nexus-hub/src/scripts/installer.sh" \
            || { echo "FAIL: bootstrap did not extract the catalog to ~/.nexus-hub/src"; exit 1; }
          test -d "$home/.nexus-hub" \
            || { echo "FAIL: ~/.nexus-hub not populated"; exit 1; }
          echo "OK: standalone bootstrap populated $home/.nexus-hub"
          # The install drops a `nexus-hub` launcher on PATH (Phase 3 CLI). Assert
          # `--version` reports a semver (the Phase 5 DoD). Prefer the installed
          # launcher; fall back to the extracted CLI core (its plugin.json version
          # fallback always resolves after extraction) so the version-reading path
          # is proven on this OS even if the headless install stopped short of the
          # launcher step. The launcher-wiring itself is unit-tested in
          # tests/installer/test_upgrade_cli.py.
          launcher="$home/.nexus-hub/bin/nexus-hub"
          core="$home/.nexus-hub/src/scripts/nexus_hub_cli.py"
          export NEXUS_HUB_HOME="$home/.nexus-hub"
          if [ -x "$launcher" ]; then
            ver="$("$launcher" --version)" \
              || { echo "FAIL: nexus-hub launcher --version exited non-zero"; exit 1; }
            echo "launcher: $ver"
          elif [ -f "$core" ]; then
            echo "WARN: launcher not installed; checking the extracted CLI core"
            ver="$(python3 "$core" --version)" \
              || { echo "FAIL: nexus_hub_cli.py --version exited non-zero"; exit 1; }
            echo "core: $ver"
          else
            echo "FAIL: neither the nexus-hub launcher nor the CLI core is present"; exit 1
          fi
          printf '%s\n' "$ver" | grep -qE 'nexus-hub [0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "FAIL: unexpected --version output: $ver"; exit 1; }
          echo "OK: nexus-hub --version works ($ver)"

      - name: bash missing-tool simulation exits non-zero with a clear message
        run: |
          set -uo pipefail
          bash_bin="$(command -v bash)"
          out="$(PATH='' NEXUS_HUB_FORCE_STANDALONE=1 "$bash_bin" install.sh 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          test "$rc" -ne 0 || { echo "FAIL: expected a non-zero exit"; exit 1; }
          printf '%s\n' "$out" | grep -qi curl || { echo "FAIL: message did not name curl/wget"; exit 1; }
          echo "OK: missing-tool path exits $rc with a clear message"

      - name: PowerShell bootstrap AST parse + precheck (pwsh)
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "install.ps1 AST OK"
          $env:NEXUS_HUB_FORCE_STANDALONE = '1'
          $env:NEXUS_HUB_PRECHECK_ONLY = '1'
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: precheck exit $LASTEXITCODE"; exit 1 }
          Write-Host "OK: pwsh precheck passed"

  bootstrap-windows:
    # v3.7.0 Phase 5: run the standalone PowerShell bootstrap end-to-end on a real
    # Windows runner. Before Phase 5 the Windows path had only been AST-parsed and
    # precheck-run (under pwsh on Linux), so a Windows runner is the only place the
    # real `irm | iex` standalone flow is exercised.
    #
    # This used to justify itself with WN-v36-1 ("the dev host cannot run the bash
    # path at all"). That premise was DISPROVEN in v3.15.6 Phase 4: the cause was
    # PATH shadowing, not host incapability. The job's real justification is
    # unaffected and stands on its own: the `irm | iex` standalone flow is a
    # Windows-native path that only a Windows runner exercises. It drives install.ps1 in forced-standalone mode
    # against a GitHub-shaped tarball of the checkout (zero network), then asserts a
    # populated ~/.nexus-hub and a working `nexus-hub --version`.
    runs-on: windows-latest
    timeout-minutes: 30
    # Cost control: Windows is a 2x-minute runner. Run the real end-to-end
    # bootstrap on pushes only, not on PRs (PRs still get the pwsh AST-parse in
    # the `bootstrap` job).
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build a GitHub-shaped catalog tarball from the checkout
        shell: bash
        run: git archive --format=tar.gz --prefix=Nexus-Hub-main/ -o "$RUNNER_TEMP/catalog.tar.gz" HEAD

      - name: PowerShell standalone bootstrap end-to-end + nexus-hub --version
        shell: powershell
        run: |
          $nxHome = Join-Path $env:RUNNER_TEMP ("nexus-home-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $nxHome | Out-Null
          $env:USERPROFILE = $nxHome
          $env:HOME = $nxHome
          $env:NEXUS_HUB_FORCE_STANDALONE = '1'
          $env:NEXUS_HUB_TARBALL = (Join-Path $env:RUNNER_TEMP 'catalog.tar.gz')
          # Run the standalone bootstrap via Windows PowerShell 5.1 (the documented
          # floor and the `irm | iex` default on Windows). Tolerate the core
          # installer's exit code; the extraction + version assertions below are the
          # real gate.
          & .\install.ps1
          Write-Host "bootstrap rc=$LASTEXITCODE (asserting artifacts below)"
          $nx = Join-Path $nxHome '.nexus-hub'
          if (-not (Test-Path (Join-Path $nx 'src\scripts\installer.ps1'))) { Write-Host 'FAIL: bootstrap did not extract the catalog to ~/.nexus-hub/src'; exit 1 }
          if (-not (Test-Path $nx)) { Write-Host 'FAIL: ~/.nexus-hub not populated'; exit 1 }
          Write-Host "OK: standalone bootstrap populated $nx"
          # Assert a working `nexus-hub --version`. Prefer the installed .cmd
          # launcher; fall back to the extracted CLI core (plugin.json version
          # fallback) so the version path is proven on Windows Python even if the
          # headless core install stopped short of the launcher step.
          $env:NEXUS_HUB_HOME = $nx
          $launcher = Join-Path $nx 'bin\nexus-hub.cmd'
          $core = Join-Path $nx 'src\scripts\nexus_hub_cli.py'
          if (Test-Path $launcher) {
            $ver = (& $launcher --version | Out-String).Trim()
            Write-Host "launcher: $ver"
          } elseif (Test-Path $core) {
            Write-Host 'WARN: launcher not installed; checking the extracted CLI core'
            $ver = (& python $core --version | Out-String).Trim()
            Write-Host "core: $ver"
          } else {
            Write-Host 'FAIL: neither the nexus-hub launcher nor the CLI core is present'; exit 1
          }
          if ("$ver" -notmatch 'nexus-hub \d+\.\d+\.\d+') { Write-Host "FAIL: unexpected --version output: $ver"; exit 1 }
          Write-Host "OK: nexus-hub --version works ($ver)"

  tests:
    # Runs the Python test suite. Each pytest invocation is scoped to its own
    # tree so pytest does not accidentally adopt a nested `pyproject.toml` as
    # the rootdir (which previously broke module discovery when combining
    # `catalog/hooks/tests/` with `extensions/nexus-skill-server/tests/`).
    # Invoke pytest as a module so the checkout root remains importable by
    # tests that exercise the repository's `scripts` package.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          # v3.11.0 Phase 8.4: this job does pytest + 5 editable extension installs;
          # cache the pip download dir keyed on the extension manifests (pydantic,
          # mcp, and friends are the heaviest cold downloads).
          cache: 'pip'
          cache-dependency-path: 'extensions/*/pyproject.toml'

      - name: Install pytest
        run: pip install pytest

      - name: Platform-parity + installer-smoke tests (v0.9.7 regression guards)
        run: python -m pytest catalog/hooks/tests/test_platform_parity.py catalog/hooks/tests/test_installer_smoke.py -v

      - name: Full catalog/hooks test suite
        run: python -m pytest catalog/hooks/tests/ -v

      - name: Repo-level integration-registry + installer tests (v2.2.0+)
        run: python -m pytest tests/integrations tests/installer -v

      - name: CI validator tests (v2.3.0 Phase 2)
        run: python -m pytest tests/validators -v

      - name: Skills-script tests (v3.14.3 media-key setup helper + docs-audit resolver; v3.15.14 spec-artifact agreement guard)
        run: python -m pytest tests/skills -v

      - name: Plan-contract + workflow-policy tests (v3.15.8 Phase 4.4)
        # This job enumerates test directories by name rather than running
        # `pytest tests`, so a new directory is invisible to CI until it is
        # listed here. tests/plans (added in v3.15.8 Phase 1) was in exactly that
        # state; tests/workflows (Phase 4.2) would have been too.
        run: python -m pytest tests/plans tests/workflows -v

      - name: Install skill-server (and transitive deps like pydantic via mcp)
        run: pip install -e "extensions/nexus-skill-server/[dev]"

      - name: Skill-server tests
        run: python -m pytest extensions/nexus-skill-server/tests/ -v

      - name: Install code-search MCP server (v1.0.0+)
        run: pip install -e "extensions/nexus-code-search/[dev]"

      - name: Code-search tests
        run: python -m pytest extensions/nexus-code-search/tests/ -v

      - name: Install web-fetch MCP server (v1.0.0+)
        run: pip install -e "extensions/nexus-web-fetch/[dev]"

      - name: Web-fetch tests
        run: python -m pytest extensions/nexus-web-fetch/tests/ -v

      - name: Install skill-security scanner (v3.0.0+)
        run: pip install -e "extensions/nexus-skill-scanner/[dev]"

      - name: Skill-scanner tests
        run: python -m pytest extensions/nexus-skill-scanner/tests/ -v

      - name: Install context-compressor engine (v3.2.0+)
        run: pip install -e "extensions/nexus-context-compressor/[dev]"

      - name: Context-compressor tests
        run: python -m pytest extensions/nexus-context-compressor/tests/ -v

  tests-windows:
    # v3.15.6 Phase 4: run the hook suite on a real Windows host so the catalog's
    # *.ps1 hooks are exercised on Windows PowerShell 5.1, not only on the ubuntu
    # leg's pwsh 7.
    #
    # This is evidence-driven, not belt-and-braces. The v3.15.6 Phase 3 provenance
    # ledger shipped a defect where `Add-Content -Encoding utf8` emits a UTF-8 BOM:
    # that behavior is specific to Windows PowerShell 5.1 and does NOT reproduce
    # under pwsh 7, so the ubuntu leg would have passed a ledger whose first field
    # was unparseable on every Windows user's machine. Only a 5.1 leg catches the
    # class. NEXUS_TEST_POWERSHELL pins the edition, because the test fixture
    # otherwise prefers pwsh and the Windows image has both.
    #
    # Cost control: windows-latest is a 2x-minute runner, so this runs on pushes
    # only, matching the bootstrap-windows and install-smoke gating.
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Hook suite on Windows PowerShell 5.1
        env:
          # Pin the edition under test; see the job comment above.
          NEXUS_TEST_POWERSHELL: powershell
        run: python -m pytest catalog/hooks/tests -q

      - name: Installer + validator suites on Windows
        env:
          NEXUS_TEST_POWERSHELL: powershell
        run: python -m pytest tests/installer tests/validators -q

      - name: Codex native agent/hook delivery on Windows (v3.15.8 Phase 5)
        # Scoped to the one integration file rather than all of tests/integrations,
        # which would add ~15 minutes of Windows runner time for coverage the
        # ubuntu `tests` job already provides. What is Windows-specific here is the
        # commandWindows registration and the path handling that decides which
        # hooks.json handlers Nexus-Hub owns, so that is what this leg proves.
        env:
          NEXUS_TEST_POWERSHELL: powershell
        run: python -m pytest tests/integrations/test_codex_native.py -q

      - name: Copilot agents + Hermes layout on Windows (v3.15.8 Phase 8)
        # Copilot's global agent dir resolves off the user profile, and the
        # Hermes depth-1 guard walks a delivered tree, so both are worth running
        # where path semantics and case-insensitivity differ from ubuntu.
        env:
          NEXUS_TEST_POWERSHELL: powershell
        run: python -m pytest tests/integrations/test_copilot_hermes_native.py -q

      - name: Kimi native agent/hook delivery on Windows (v3.15.8 Phase 7)
        # Two Windows-specific things here: the host-selected .ps1 command, and
        # the config.toml marker-block splice, whose line handling is where a
        # CRLF checkout could silently break the round trip.
        env:
          NEXUS_TEST_POWERSHELL: powershell
        run: python -m pytest tests/integrations/test_kimi_native.py -q

      - name: Gemini CLI + Qwen hook delivery on Windows (v3.15.8 Phase 6)
        # Higher stakes on Windows than the Codex leg: neither platform has a
        # commandWindows slot, so the command that gets registered is chosen from
        # the HOST. On a Windows runner this asserts the real branch -- the .ps1
        # sibling, the PowerShell-flavored guardrails, and the $env: form of the
        # project-dir variable -- which an ubuntu-only run can only simulate.
        env:
          NEXUS_TEST_POWERSHELL: powershell
        run: python -m pytest tests/integrations/test_settings_hooks.py -q

  install-smoke:
    # v3.11.0 Phase 7.5: prove the catalog lands at each platform's real read-path
    # and that the project auto-seed produces .agents/workflows. Uses the registry
    # installer (a fast, deterministic file mirror - no MCP/venv) so it runs cheaply
    # on every OS. Cursor/Copilot GLOBAL slash surfaces are installer-block-owned and
    # exercised by the `bootstrap` job. Cost control: ubuntu on PRs; +macOS/Windows on pushes.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Global registry install into a throwaway HOME, then verify read-paths (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          home="$(mktemp -d "${TMPDIR:-/tmp}/nx-smoke.XXXXXX")/home"
          mkdir -p "$home"
          HOME="$home" python scripts/lib/integrations/runner.py install --scope global \
            --integrations claude,codex,gemini,antigravity2,opencode --overwrite --quiet
          out="$(HOME="$home" python scripts/lib/integrations/runner.py verify --target "$home" 2>&1 || true)"
          printf '%s\n' "$out"
          for expect in \
            "Claude -- commands:ok, skills:ok" \
            "Codex / ChatGPT -- skills:ok" \
            "Gemini IDE -- skills:ok, workflows:ok" \
            "Antigravity 2.0 IDE (global) -- skills:ok" \
            "OpenCode -- skills:ok"; do
            printf '%s\n' "$out" | grep -qF "$expect" \
              || { echo "FAIL: read-path not populated: $expect"; exit 1; }
          done
          echo "OK: global platform read-paths populated on ${{ matrix.os }}"

      - name: Project auto-seed smoke (Linux only) - init seeds .agents/workflows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          repo="$(mktemp -d "${TMPDIR:-/tmp}/nx-proj.XXXXXX")/proj"
          mkdir -p "$repo"
          git -C "$repo" init -q
          python scripts/lib/integrations/runner.py init --target "$repo" --quiet
          test -n "$(ls -A "$repo/.agents/workflows" 2>/dev/null)" \
            || { echo "FAIL: init did not populate .agents/workflows in the current repo"; exit 1; }
          echo "OK: project auto-seed populated .agents/workflows"

      - name: Global registry install into a throwaway HOME, then verify read-paths (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP ("nx-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          $env:USERPROFILE = $h; $env:HOME = $h
          & python scripts\lib\integrations\runner.py install --scope global --integrations claude,codex,gemini,antigravity2,opencode --overwrite --quiet
          $out = (& python scripts\lib\integrations\runner.py verify --target $h | Out-String)
          Write-Host $out
          foreach ($expect in @(
            "Claude -- commands:ok, skills:ok",
            "Codex / ChatGPT -- skills:ok",
            "Gemini IDE -- skills:ok, workflows:ok",
            "Antigravity 2.0 IDE (global) -- skills:ok",
            "OpenCode -- skills:ok")) {
            if ($out -notmatch [regex]::Escape($expect)) { Write-Host "FAIL: read-path not populated: $expect"; exit 1 }
          }
          Write-Host "OK: global platform read-paths populated (Windows)"
