name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (standard checks only)
        # Skip local Python hooks that require project-specific tooling.
        # lint-templates and build-catalogs are enforced on commit locally.
        run: SKIP=lint-templates,build-catalogs pre-commit run --all-files

      - name: Validate skills.json
        run: python -c "import json; d = json.load(open('data/skills.json')); print(f'skills.json OK — {len(d[\"skills\"])} skills')"

      - name: Validate workflows.json
        run: python -c "import json; d = json.load(open('data/workflows.json')); print(f'workflows.json OK — {len(d[\"workflows\"])} workflows')"

      - name: Validate bundles.json
        run: python -c "import json; d = json.load(open('data/bundles.json')); print(f'bundles.json OK — {len(d[\"bundles\"])} bundles')"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint installer scripts
        run: |
          shellcheck --severity=warning scripts/installer.sh install.sh

      - name: Lint hook scripts
        run: |
          find catalog/hooks -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning || true

  tests:
    # Runs the Python test suite. Each pytest invocation is scoped to its own
    # tree so pytest does not accidentally adopt a nested `pyproject.toml` as
    # the rootdir (which previously broke module discovery when combining
    # `catalog/hooks/tests/` with `extensions/devai-skill-server/tests/`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Platform-parity + installer-smoke tests (v0.9.7 regression guards)
        run: pytest catalog/hooks/tests/test_platform_parity.py catalog/hooks/tests/test_installer_smoke.py -v

      - name: Full catalog/hooks test suite
        run: pytest catalog/hooks/tests/ -v

      - name: Install skill-server (and transitive deps like pydantic via mcp)
        run: pip install -e "extensions/devai-skill-server/[dev]"

      - name: Skill-server tests
        run: pytest extensions/devai-skill-server/tests/ -v
