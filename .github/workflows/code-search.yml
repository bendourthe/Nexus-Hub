name: code-search

# Fast, path-scoped feedback for the nexus-code-search extension (v3.15.0
# context-map Phase 1). Triggers ONLY when the extension tree or this workflow
# changes, so unrelated commits spend no minutes here. The comprehensive,
# always-on gate remains the `tests` job in ci.yml; this job is the quick scoped
# signal for extension-only work.
on:
  push:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-code-search/**'
      - '.github/workflows/code-search.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-code-search/**'
      - '.github/workflows/code-search.yml'

# Cancel superseded runs of the same ref so only the latest commit's run
# survives (the single largest action-minute saver).
# v3.15.8 Phase 9.3: least privilege. This workflow builds and tests only --
# no artifact upload, no gh CLI, no comments, no pushes -- so read-only
# contents is the complete requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-network-blocked:
    name: Test with outbound network blocked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          # Cache pip downloads keyed on the extension manifest so the tree-sitter
          # grammar wheels (the heaviest cold download) are not refetched.
          cache: 'pip'
          cache-dependency-path: 'extensions/nexus-code-search/pyproject.toml'

      - name: Install code-search MCP server (with dev extras)
        run: pip install -e "extensions/nexus-code-search/[dev]"

      - name: Full suite and benchmark with egress denied
        run: |
          sudo unshare --net --mount-proc bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ls /sys/class/net)" = "lo"
            python -m pytest extensions/nexus-code-search/tests/ -q
            cd extensions/nexus-code-search
            python benchmarks/harness.py --check --work /tmp/nexus-code-search-benchmark --json-out /tmp/nexus-code-search-benchmark.json --markdown-out /tmp/nexus-code-search-benchmark.md
          '
