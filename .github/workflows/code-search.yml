name: code-search

# Fast, path-scoped feedback for the nexus-code-search extension (v3.15.0
# context-map Phase 1). Triggers ONLY when the extension tree or this workflow
# changes, so unrelated commits spend no minutes here. The comprehensive,
# always-on gate remains the `tests` job in ci.yml; this job is the quick scoped
# signal for extension-only work.
on:
  # v4.0.0 event separation: the `push` leg to the same protected branches was
  # removed. Under a pull-request-only merge policy that push IS the merge commit
  # of the pull request that just ran, so the tree is identical and the second run
  # cannot discover anything the first did not. See
  # docs/releases/v4/v4.0/development/ci-cd-lifecycle-contract.md section 4.
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/nexus-code-search/**'
      - '.github/workflows/code-search.yml'

# Cancel superseded runs of the same ref so only the latest commit's run
# survives (the single largest action-minute saver).
# v3.15.8 Phase 9.3: least privilege. This workflow builds and tests only --
# no artifact upload, no gh CLI, no comments, no pushes -- so read-only
# contents is the complete requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-network-blocked:
    name: Test with outbound network blocked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Build the offline test image
        run: |
          docker build --tag nexus-code-search-offline --file - extensions/nexus-code-search <<'DOCKERFILE'
          FROM python:3.11-slim
          WORKDIR /workspace
          RUN apt-get update \
              && apt-get install --yes --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          COPY pyproject.toml README.md /package/
          COPY src /package/src
          COPY tests /package/tests
          RUN python -m pip install --no-cache-dir --editable "/package[dev]"
          DOCKERFILE

      - name: Full suite and benchmark with egress denied
        run: |
          docker run --rm --network none \
            --env NEXUS_CODE_SEARCH_BLOCK_NETWORK=1 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            nexus-code-search-offline bash -c '
            set -euo pipefail
            test -d /sys/class/net/lo
            ! find /sys/class/net -mindepth 1 -maxdepth 1 ! -name lo -print -quit | grep -q .
            python -m pytest extensions/nexus-code-search/tests/ -q -p no:cacheprovider
            cd extensions/nexus-code-search
            python benchmarks/harness.py --check --work /tmp/nexus-code-search-benchmark --json-out /tmp/nexus-code-search-benchmark.json --markdown-out /tmp/nexus-code-search-benchmark.md
          '
