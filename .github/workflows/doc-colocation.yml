name: Doc Co-location

# v3.14.2 Phase 3 (Fix C): enforce the comparison / adoption-plan co-location
# invariant - a /compare report and the /plan from-comparison plan it seeds must
# live in the SAME version directory (docs/v<MAJOR>/v<MAJOR>.<MINOR>/). The main
# ci.yml deliberately skips docs/** (paths-ignore), so this dedicated workflow is
# the one place a docs-only change (where a comparison/plan gets misplaced) is
# gated. The logic mirrors the inline bash snippet in
# catalog/skills/workflow/documentation-consistency/SKILL.md (Step 7.5); it is NOT
# a scripts/ artifact, so it needs no installer copy-step or .ps1 sibling.
on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'catalog/skills/**'
      # The gate must re-run when the gate itself changes. Without this, a fix to
      # this file cannot be verified by the check it fixes: the push touches no
      # docs/ or catalog/skills/ path, so nothing runs and the workflow keeps
      # showing its previous result.
      - '.github/workflows/doc-colocation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'catalog/skills/**'
      # The gate must re-run when the gate itself changes. Without this, a fix to
      # this file cannot be verified by the check it fixes: the push touches no
      # docs/ or catalog/skills/ path, so nothing runs and the workflow keeps
      # showing its previous result.
      - '.github/workflows/doc-colocation.yml'

# v3.15.8 Phase 9.3: least privilege. This workflow builds and tests only --
# no artifact upload, no gh CLI, no comments, no pushes -- so read-only
# contents is the complete requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  colocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Comparison / adoption-plan co-location check
        # Grandfathering: only the CURRENT major's active version dirs are
        # enforced, so docs/archive/** and prior-major trees are excluded simply
        # by scoping the search to docs/v<CURRENT_MAJOR>/. Assumes the canonical
        # docs/v<MAJOR>/v<MAJOR>.<MINOR>/ layout (legacy flat layouts are
        # grandfathered). Fails only on MISMATCH; a legacy comparison with no
        # `Adoption target:` field is a non-fatal note.
        run: |
          set -uo pipefail
          # GitHub runs a `run:` block as `bash -e`, but this script is written
          # for the opposite contract: it collects EVERY mismatch and decides at
          # the end. It leans on idioms that legitimately return non-zero when
          # nothing is wrong -- `[ a != b ] && echo ...` on a matching pair, and
          # a `grep` for a field a legacy comparison is allowed not to have (with
          # `pipefail`, that failure propagates out of the assignment). Under -e
          # any of those aborts `out=$(report)` mid-scan.
          #
          # This was invisible for as long as real mismatches existed, because an
          # -e abort and an intended failure both exit 1. Fixing the last
          # mismatch is what exposed it: the check then failed while CLEAN,
          # printing the banner and nothing else. `set +e` restores the intent.
          set +e
          CURRENT_MAJOR=$(ls -d docs/v[0-9]* 2>/dev/null | sed -E 's|docs/v([0-9]+).*|\1|' | sort -n | tail -1)
          [ -z "${CURRENT_MAJOR}" ] && { echo "No docs/v<N> tree found; nothing to check."; exit 0; }
          echo "Enforcing co-location under docs/v${CURRENT_MAJOR}/ (docs/archive/** and prior majors grandfathered)"
          verdir() { echo "$1" | sed -E 's|(docs/v[0-9]+/v[0-9]+\.[0-9]+)/.*|\1|'; }
          report() {
            # Direction 1: plan -> comparison (anchored on `**Seeded from**:`).
            find "docs/v${CURRENT_MAJOR}" -type f -path "*/plans/*.md" 2>/dev/null | while read -r plan; do
              seeded=$(grep -E '\*\*Seeded from\*\*:' "$plan" | grep -oE 'docs/v[0-9]+/[^`) ]+\.md' | head -1)
              [ -z "$seeded" ] && continue
              pdir=$(verdir "$plan"); cdir=$(verdir "$seeded")
              [ "$pdir" != "$cdir" ] && echo "MISMATCH (plan/comparison): $plan (in $pdir) is seeded from $seeded (in $cdir); expected the comparison under $pdir/comparisons/"
            done
            # Direction 2: comparison -> its declared adoption target.
            find "docs/v${CURRENT_MAJOR}" -type f -path "*/comparisons/*.md" 2>/dev/null | while read -r cmp; do
              tgt=$(grep -iE 'Adoption target' "$cmp" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
              [ -z "$tgt" ] && continue
              major=$(echo "$tgt" | sed -E 's|v([0-9]+)\..*|\1|')
              minor=$(echo "$tgt" | sed -E 's|v[0-9]+\.([0-9]+)\..*|\1|')
              expected="docs/v${major}/v${major}.${minor}"
              cdir=$(verdir "$cmp")
              [ "$cdir" != "$expected" ] && echo "MISMATCH (comparison placement): $cmp (in $cdir) declares Adoption target $tgt; expected under ${expected}/comparisons/"
            done
          }
          out=$(report)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q '^MISMATCH'; then
            echo "FAIL: comparison / adoption-plan co-location mismatch(es) found - reconcile via docs-layout-refactor"
            exit 1
          fi
          echo "OK: no comparison / adoption-plan co-location mismatches under docs/v${CURRENT_MAJOR}/"
