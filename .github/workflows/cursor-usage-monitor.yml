name: cursor-usage-monitor

# Path-filtered: runs only when the cursor-usage-monitor extension changes, so it
# costs action minutes only for that surface.
# The extension is a Node/TypeScript VSIX with a Vitest suite; the repo-wide
# ci.yml covers Python only, so this workflow is the extension's gate.
#
# scripts/installer.{sh,ps1} are deliberately NOT trigger paths even though both
# install this extension. ci.yml runs on every non-docs change and already runs
# catalog/hooks/tests/test_installer_smoke.py, which asserts dual-host targeting
# and vendor order. Adding the installers here would spin up a Node runner to
# rebuild an unchanged VSIX on every installer edit.
on:
  # v4.0.0 event separation: the `push` leg to the same protected branches was
  # removed. Under a pull-request-only merge policy that push IS the merge commit
  # of the pull request that just ran, so the tree is identical and the second run
  # cannot discover anything the first did not. See
  # docs/policy/ci-cd-lifecycle-contract.md section 4.
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/cursor-usage-monitor/**'
      - 'tests/fixtures/cursor-usage/**'
      - '.github/workflows/cursor-usage-monitor.yml'
      - 'scripts/ci/**'

# Read-only: the job builds and tests, and publishes nothing.
permissions:
  contents: read

# Cancel superseded runs of the same ref (the single largest action-minute saver).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extensions/cursor-usage-monitor/package-lock.json

      - name: Install dependencies
        # --ignore-scripts: no dependency lifecycle script runs (AR-60). Proven
        # 2026-10-10 that compile, tests, and the VSIX are byte-identical without
        # them; ttf2woff2 is used only by the local icon generator, not this job.
        run: npm ci --ignore-scripts --prefix extensions/cursor-usage-monitor

      - name: Repository-native cursor-usage-monitor profile
        run: python scripts/ci/run.py --profile full --only cursor-usage-monitor --reports-dir reports

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-usage-monitor-vsix
          path: extensions/cursor-usage-monitor/*.vsix
          if-no-files-found: error
          retention-days: 7

      - name: Publish native profile summary
        if: always()
        shell: bash
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Retain native profile reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-usage-monitor-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  e2e-cursor-profile:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cursor-usage-monitor-vsix
          path: packed-vsix

      - name: Repository-native optional Cursor profile
        run: python scripts/ci/run.py --profile platform --only cursor-profile --reports-dir reports

      - name: Publish native profile summary
        if: always()
        shell: bash
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Retain native profile reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-profile-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  cursor-required:
    needs: [build-and-test, e2e-cursor-profile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require build and selected optional-host scenario
        env:
          R_build: ${{ needs['build-and-test'].result }}
          R_profile: ${{ needs['e2e-cursor-profile'].result }}
        run: |
          set -euo pipefail
          test "$R_build" = success
          test "$R_profile" = success
