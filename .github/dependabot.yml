version: 2

# Monthly cadence with a low open-PR limit. Each Dependabot PR triggers CI, and
# CI minutes are a single account-wide GitHub Actions pool shared across all
# repos, so keep the churn small. Do NOT auto-merge.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /extensions/claude-usage-monitor
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # vsce package fails when @types/vscode exceeds engines.vscode (^1.85.0).
      # PR #34 (cursor) and PR #24 (claude) were that class. Bump types only
      # in the same commit that bumps engines, not via Dependabot.
      - dependency-name: "@types/vscode"

  - package-ecosystem: npm
    directory: /extensions/codex-usage-monitor
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # vsce package fails when @types/vscode exceeds engines.vscode (^1.85.0).
      # PR #34 (cursor) and PR #24 (claude) were that class. Bump types only
      # in the same commit that bumps engines, not via Dependabot.
      - dependency-name: "@types/vscode"

  - package-ecosystem: npm
    directory: /extensions/cursor-usage-monitor
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # vsce package fails when @types/vscode exceeds engines.vscode (^1.85.0).
      # PR #34 (cursor) and PR #24 (claude) were that class. Bump types only
      # in the same commit that bumps engines, not via Dependabot.
      - dependency-name: "@types/vscode"

  - package-ecosystem: pip
    directory: /extensions/nexus-skill-server
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - python
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
