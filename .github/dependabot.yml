version: 2

# Version-update pull requests are disabled (open-pull-requests-limit: 0 on every
# ecosystem). scripts/check_commit_attribution.py accepts only the maintainer's
# identity by a deliberately closed allowlist, so a Dependabot-authored commit can
# never pass the required check. The maintainer applies dependency updates as their
# own commits instead. Dependabot vulnerability alerts and security updates are
# separate repository settings, not controlled by this file (both were off on
# 2026-11-01). The entries below remain so the ecosystems stay declared
# (tests assert that every usage monitor is tracked) and the ignore rules persist.
# Do NOT auto-merge.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /extensions/claude-usage-monitor
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # vsce package fails when @types/vscode exceeds engines.vscode (^1.85.0).
      # PR #34 (cursor) and PR #24 (claude) were that class. Bump types only
      # in the same commit that bumps engines, not via Dependabot.
      - dependency-name: "@types/vscode"

  - package-ecosystem: npm
    directory: /extensions/codex-usage-monitor
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
