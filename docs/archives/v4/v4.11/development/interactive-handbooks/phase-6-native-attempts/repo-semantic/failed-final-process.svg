<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-labelledby="pg-title pg-desc" font-family="Arial, Helvetica, sans-serif">
<title id="pg-title">Observation to queue to analyst to archive</title>
<desc id="pg-desc">Four-stage flow: Observation enters the Queue, which holds at most 24; the Analyst reviews queued items; approved records move to the Archive. Observation to Queue: enters the queue, admission gated by queue_capacity = 24. Queue to Analyst review: an analyst reviews them, no ordering or selection rule is stated. Analyst review to Archive: approved records are archived, outcome for records that are not approved is not stated. retry_limit = 3: The README says configuration controls retry attempts, but no supplied module implements a retry. The stage this binds to is not stated. timeout_seconds = 8: The README says configuration controls a timeout, but no supplied module implements a timer. The stage this binds to is not stated.</desc>
