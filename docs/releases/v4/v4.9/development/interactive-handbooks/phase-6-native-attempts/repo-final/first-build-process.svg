<svg xmlns="http://www.w3.org/2000/svg" class="ops-process-svg ops-flow-wide" viewBox="0 0 940 260" role="img" aria-labelledby="operations-process-title operations-process-desc"><title id="operations-process-title">Observation to queue to analyst to archive</title><desc id="operations-process-desc">Incoming observations enter the queue. An analyst reviews them. Approved records are archived. This is the documented workflow; review and archive execution are not implemented in service.py. Reliability unavailable.</desc><style>svg{--flow-node:#f7f3e9;--flow-ink:#172b3b;--flow-edge:#86431e;background:#f7f3e9;font-family:Arial,sans-serif}.ops-flow-node{fill:var(--flow-node);stroke:var(--flow-ink);stroke-width:2}.ops-flow-edge{fill:none;stroke:var(--flow-edge);stroke-width:3}.ops-node-title{fill:var(--flow-ink);font-size:26px;font-weight:700}.ops-node-detail{fill:var(--flow-ink);font-size:20px}</style><defs><marker id="operations-process-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="var(--flow-edge)"/></marker></defs><path class="ops-flow-edge" data-edge="Observation:Queue" data-start="200,99.0" data-end="260,159.0" d="M200 99.0 C230.0 99.0 230.0 159.0 260 159.0" marker-end="url(#operations-process-arrow)"><title>Observation to Queue</title></path><path class="ops-flow-edge" data-edge="Queue:Analyst" data-start="440,159.0" data-end="500,99.0" d="M440 159.0 C470.0 159.0 470.0 99.0 500 99.0" marker-end="url(#operations-process-arrow)"><title>Queue to Analyst</title></path><path class="ops-flow-edge" data-edge="Analyst:Archive" data-start="680,99.0" data-end="740,159.0" d="M680 99.0 C710.0 99.0 710.0 159.0 740 159.0" marker-end="url(#operations-process-arrow)"><title>Analyst to Archive</title></path><g data-flow-node="Observation"><rect class="ops-flow-node" x="20" y="48" width="180" height="102" rx="12"/><text class="ops-node-title" x="110.0" y="91" text-anchor="middle">Observation</text><text class="ops-node-detail" x="110.0" y="124" text-anchor="middle">Incoming record</text></g><g data-flow-node="Queue"><rect class="ops-flow-node" x="260" y="108" width="180" height="102" rx="12"/><text class="ops-node-title" x="350.0" y="151" text-anchor="middle">Queue</text><text class="ops-node-detail" x="350.0" y="184" text-anchor="middle">Pending review</text></g><g data-flow-node="Analyst"><rect class="ops-flow-node" x="500" y="48" width="180" height="102" rx="12"/><text class="ops-node-title" x="590.0" y="91" text-anchor="middle">Analyst</text><text class="ops-node-detail" x="590.0" y="124" text-anchor="middle">Reviews records</text></g><g data-flow-node="Archive"><rect class="ops-flow-node" x="740" y="108" width="180" height="102" rx="12"/><text class="ops-node-title" x="830.0" y="151" text-anchor="middle">Archive</text><text class="ops-node-detail" x="830.0" y="184" text-anchor="middle">Approved records</text></g></svg>
