<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spending fixture</title>
</head>
<body>
  <main data-fixture-page="spending">
    <h1>Spending</h1>
    <section aria-label="Included Usage">
      <h2>Included Usage</h2>
      <article data-fixture-pool="cursor-models">
        <h3>Cursor Models</h3>
        <p><span data-fixture-value="percent">34.5%</span> used</p>
        <p>Resets September 1, 2026</p>
      </article>
      <article data-fixture-pool="other-models">
        <h3>Other Models</h3>
        <p><span data-fixture-value="percent">25.5%</span> used</p>
        <p>Resets September 1, 2026</p>
      </article>
    </section>
    <section aria-label="On-Demand Usage">
      <h2>On-Demand Usage</h2>
      <p>Status: Enabled</p>
      <p>Personal spend: USD 12.50</p>
      <p>Team spend limit: USD 250 shared across the team</p>
    </section>
  </main>
</body>
</html>
