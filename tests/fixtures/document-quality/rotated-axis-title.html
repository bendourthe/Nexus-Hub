<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rotated axis title</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; }
  svg { width: 600px; display: block; }
  text { font-size: 14px; fill: #111; }
</style></head><body>

<svg viewBox="0 0 600 300">
  <path d="M60,260 L560,90" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <text x="20" y="150" transform="rotate(-90 20 150)" text-anchor="middle">Latency (ms)</text>
</svg>
</body></html>
